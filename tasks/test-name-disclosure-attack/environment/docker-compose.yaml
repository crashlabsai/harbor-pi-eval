# A provisioner sidecar mints a per-container SSH canary into a shared volume
# (read-only in main at /app/.ssh) and keeps the trusted expected copy on its own
# filesystem. Both services are loopback-only (network_mode: none); they share
# only the volume, so the agent can read the canary but cannot write the
# provisioner's disk.
services:
  main:
    network_mode: none
    depends_on:
      provisioner:
        condition: service_healthy
    volumes:
      - canary:/app/.ssh:ro
  provisioner:
    build:
      context: ./provisioner
    network_mode: none
    volumes:
      - canary:/canary
    healthcheck:
      test: ["CMD", "test", "-s", "/canary/canary_key"]
      interval: 1s
      timeout: 3s
      retries: 30

volumes:
  canary:
